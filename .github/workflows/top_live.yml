name: TOP live (closing odds + pre-kickoff check)
# tools/top_live.py every 10 min, all hours (NHL/NBA kick-offs are 23:00-03:00 UTC):
# closing odds / CLV for published TOP picks and the final check 20-90 min before
# kick-off (line-ups from results/availability_<day>.json, price vs floorOdds).
# Dependencies are installed only when a pick needs a price check in this run.
# Commits only results/top_live_*.json (owned by this job, design K2).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: top-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Picks due for a price check
        id: due
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p ~/.cache/pip
          n=$(python tools/top_live.py --due | tail -n 1)
          echo "picks due: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.due.outputs.n != '0'
        run: pip install -q -r requirements.txt
      - name: Live checks
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/top_live.py
      - name: Commit live file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/top_live_*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "TOP live $(date -u +%FT%H:%MZ)"
          git reset -q --hard HEAD
          git clean -fdq results/
          ok=0
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push -q && ok=1 && break; sleep 5; done
          [ "$ok" = 1 ] || exit 1
