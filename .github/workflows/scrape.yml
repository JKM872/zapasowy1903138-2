name: Sports Scraper Pipeline

on:
  # Run daily at 0:00 UTC (2:00 CEST summer / 1:00 CET winter = ~2:00 Polish time)
  schedule:
    - cron: '0 0 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport to scrape (all = all sports)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - football
          - basketball
          - volleyball
          - handball
          - hockey
          - tennis
      send_email:
        description: 'Send email notification'
        required: false
        default: true
        type: boolean

env:
  PYTHONIOENCODING: utf-8

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        sport: [football, basketball, volleyball, handball, hockey, tennis]
      fail-fast: false
      max-parallel: 6
    
    services:
      # FlareSolverr for Cloudflare bypass
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          CAPTCHA_SOLVER: none

      # v9.0 — Cloudflare WARP proxy for SofaScore.
      # Cloudflare blokuje GHA datacenter IPs dla SofaScore. WARP daje czyste
      # IP (Cloudflare nie blokuje wlasnych IP) — proxy SOCKS5 na porcie 1080.
      # Tylko SofaScore uzywa WARP (przez SOFASCORE_PROXY env), reszta scraperow
      # idzie normalnie przez GHA IP.
      warp:
        image: caomingjun/warp:latest
        ports:
          - 1080:1080
        env:
          WARP_SLEEP: 2
        options: --cap-add NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0 --sysctl net.ipv4.conf.all.src_valid_mark=1
        volumes:
          - /lib/modules:/lib/modules
    
    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v6
      
      # 2. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 3. Setup Node.js (for Puppeteer)
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      
      # 4. Setup Chrome (pre-installed on ubuntu-latest, no apt/snap needed)
      - name: Setup Chrome (pre-installed)
        run: |
          CHROME_PATH=$(which google-chrome-stable || which google-chrome || echo "")
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::Chrome not found on runner"
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> $GITHUB_ENV
          echo "✅ Chrome: $($CHROME_PATH --version)"
      
      # 5. Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 🔥 Cloudflare Bypass packages (curl_cffi is PRIMARY bypass method)
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
          pip install curl-cffi cloudscraper httpx[http2]
          # v9.0: SOCKS5 proxy support for WARP via SOFASCORE_PROXY env
          pip install 'requests[socks]' 'PySocks>=1.7.1'
          python -c "from curl_cffi import requests; print('curl_cffi OK')"
      
      # 6. Install Node.js dependencies (Puppeteer)
      - name: Install Node.js dependencies
        run: npm ci || npm install
      
      # 7. Wait for FlareSolverr to be ready
      - name: Wait for FlareSolverr
        run: |
          echo "⏳ Waiting for FlareSolverr to be ready..."
          FLARESOLVERR_READY=false
          for i in {1..30}; do
            if curl -s http://localhost:8191/health | grep -q '"status"'; then
              echo "✅ FlareSolverr health endpoint responding!"
              TEST_RESPONSE=$(curl -s -X POST http://localhost:8191/v1 \
                -H "Content-Type: application/json" \
                -d '{"cmd":"request.get","url":"https://www.google.com","maxTimeout":10000}' \
                --max-time 15 2>/dev/null || echo "TIMEOUT")
              if echo "$TEST_RESPONSE" | grep -q '"status":"ok"'; then
                echo "✅ FlareSolverr verified - working correctly!"
                FLARESOLVERR_READY=true
                break
              fi
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          if [ "$FLARESOLVERR_READY" != "true" ]; then
            echo "⚠️ FlareSolverr may not be fully ready, continuing anyway..."
          fi

      # 7b. Wait for WARP proxy to be ready (v9.0 — SofaScore CF bypass)
      - name: Wait for WARP and verify clean IP
        run: |
          echo "⏳ Waiting for Cloudflare WARP proxy on localhost:1080..."
          WARP_READY=false
          for i in {1..30}; do
            # Test SOCKS5 — pobierz IP zewnetrzny przez WARP
            CURRENT_IP=$(curl -s --max-time 10 --socks5 localhost:1080 https://api.ipify.org 2>/dev/null || echo "")
            if [ -n "$CURRENT_IP" ]; then
              # Sprawdz czy WARP dziala — endpoint cdn-cgi/trace pokaze warp=on
              WARP_STATUS=$(curl -s --max-time 10 --socks5 localhost:1080 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -E '^warp=' | cut -d= -f2 || echo "off")
              echo "✅ WARP proxy responding! IP=$CURRENT_IP, warp=$WARP_STATUS"
              if [ "$WARP_STATUS" = "on" ] || [ "$WARP_STATUS" = "plus" ]; then
                echo "✅ WARP active - SofaScore requests will use clean Cloudflare IP"
                WARP_READY=true
                break
              else
                echo "⚠️ WARP proxy responding but warp=$WARP_STATUS (not active yet)"
              fi
            fi
            echo "Waiting WARP... ($i/30)"
            sleep 3
          done
          if [ "$WARP_READY" != "true" ]; then
            echo "⚠️ WARP not fully ready - SofaScore may still hit CF block"
          fi
      
      # 8. Run the scraper for this sport
      - name: Run scraper - ${{ matrix.sport }}
        env:
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
          # v8.1: SofaScore Cloudflare bypass via manual cookies.
          # Skopiuj cf_clearance + __cf_bm z prawdziwej przegladarki na
          # https://www.sofascore.com (F12 -> Application -> Cookies) do
          # GitHub Secret SOFASCORE_COOKIES w formacie:
          # cf_clearance=ABC123; __cf_bm=XYZ789
          # cf_clearance zyje 30 dni - wystarczy odswiezac raz na miesiac.
          SOFASCORE_COOKIES: ${{ secrets.SOFASCORE_COOKIES }}
          # v9.0: SofaScore via Cloudflare WARP (Docker service "warp" na 1080).
          # Daje czyste IP Cloudflare - SofaScore nie blokuje wlasnych IP CF.
          # Tylko SofaScore requesty ida przez WARP, reszta scraperow normalnie.
          SOFASCORE_PROXY: "socks5://localhost:1080"
        run: |
          echo "🏃 Scraping ${{ matrix.sport }}..."
          TODAY=$(date +%Y-%m-%d)
          python scrape_and_notify.py \
            --date $TODAY \
            --sports ${{ matrix.sport }} \
            --to "${{ secrets.EMAIL_RECIPIENT }}" \
            --from-email "${{ secrets.EMAIL_SENDER }}" \
            --password "${{ secrets.EMAIL_PASSWORD }}" \
            --provider gmail \
            --use-forebet \
            --use-sofascore \
            --use-odds \
            --use-gemini \
            --headless
      
      # 8b. Channel qualification summary (observability)
      - name: Channel qualification summary - ${{ matrix.sport }}
        if: always()
        run: |
          TODAY=$(date +%Y-%m-%d)
          python ci_step_summary.py "${{ matrix.sport }}" "$TODAY" >> "$GITHUB_STEP_SUMMARY" || true

      # 9. Upload results as artifact
      - name: Upload results - ${{ matrix.sport }}
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.sport }}-${{ github.run_id }}
          path: |
            results/*.json
            *.html
            outputs/*.csv
            outputs/mailed_manifest_*.json
            outputs/telegram_manifest_*.json
            logs/
          retention-days: 7

  # ── Commit scraped results back to the repo ──
  commit-results:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect JSON results
        run: |
          mkdir -p results
          mkdir -p outputs
          echo "📦 Collecting JSON results from artifacts..."
          find artifacts -name '*.json' -path '*/results/*' | while read f; do
            fname=$(basename "$f")
            echo "  → $fname"
            cp "$f" "results/$fname"
          done
          echo "📦 Collecting mailed manifests from artifacts..."
          find artifacts -name 'mailed_manifest_*.json' | while read f; do
            fname=$(basename "$f")
            echo "  → $fname"
            cp "$f" "outputs/$fname"
          done
          echo "📦 Collecting telegram manifests from artifacts..."
          find artifacts -name 'telegram_manifest_*.json' | while read f; do
            fname=$(basename "$f")
            echo "  → $fname"
            cp "$f" "outputs/$fname"
          done
          echo "📋 Results directory:"
          ls -la results/ || echo "No results found"
          echo "📋 Outputs directory:"
          ls -la outputs/mailed_manifest_*.json 2>/dev/null || echo "No manifests found"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/*.json
          git add outputs/mailed_manifest_*.json 2>/dev/null || true
          git add outputs/telegram_manifest_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ️ No new results to commit"
          else
            TODAY=$(date +%Y-%m-%d)
            git commit -m "data: scraped results for $TODAY [skip ci]"
            git push
            echo "✅ Results committed and pushed"
          fi

      - name: Deploy to Heroku
        if: success()
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "⚠️ HEROKU_API_KEY not set — skipping Heroku deploy"
            echo "Set HEROKU_API_KEY secret to enable auto-deploy"
            exit 0
          fi
          # Trigger Heroku build from latest commit
          curl -s -n -X POST https://api.heroku.com/apps/pickly-67e87ed00f70/builds \
            -d '{"source_blob":{"url":"https://github.com/JKM872/zapasowy1903138-2/tarball/main"}}' \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            && echo "✅ Heroku build triggered" \
            || echo "⚠️ Heroku deploy failed (non-critical)"

