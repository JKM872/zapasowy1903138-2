name: Table Tennis Pipeline (SofaScore)

on:
  # Run daily at 06:00 UTC (~08:00 Polish). Table tennis runs many small
  # events through the day; an early-morning pull covers the day's slate.
  schedule:
    - cron: '0 6 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to scrape (YYYY-MM-DD, blank = today UTC)'
        required: false
        default: ''
        type: string
      max_matches:
        description: 'Cap matches processed (blank = no cap)'
        required: false
        default: ''
        type: string

env:
  PYTHONIOENCODING: utf-8

jobs:
  table-tennis:
    runs-on: ubuntu-latest

    services:
      # FlareSolverr for Cloudflare bypass (SofaScore API)
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          CAPTCHA_SOLVER: none

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Cloudflare bypass packages (curl_cffi is PRIMARY bypass method)
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
          pip install curl-cffi cloudscraper httpx[http2]
          pip install 'requests[socks]' 'PySocks>=1.7.1'
          python -c "from curl_cffi import requests; print('curl_cffi OK')"

      # 4. Wait for FlareSolverr to be ready
      - name: Wait for FlareSolverr
        run: |
          echo "⏳ Waiting for FlareSolverr to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8191/health | grep -q '"status"'; then
              echo "✅ FlareSolverr health endpoint responding!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      # 5. Setup Cloudflare WARP proxy (SofaScore CF bypass via clean CF IP)
      - name: Setup Cloudflare WARP proxy (SOCKS5 on :1080)
        run: |
          echo "🌐 Starting Cloudflare WARP proxy container..."
          docker run -d --name warp \
            --restart=always \
            --device-cgroup-rule='c 10:200 rwm' \
            -p 1080:1080 \
            -e WARP_SLEEP=2 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v /lib/modules:/lib/modules \
            caomingjun/warp:latest

          echo "⏳ Waiting for WARP to register and establish tunnel..."
          WARP_READY=false
          for i in {1..40}; do
            sleep 3
            CURRENT_IP=$(curl -s --max-time 10 --socks5 localhost:1080 https://api.ipify.org 2>/dev/null || echo "")
            if [ -n "$CURRENT_IP" ]; then
              WARP_STATUS=$(curl -s --max-time 10 --socks5 localhost:1080 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -E '^warp=' | cut -d= -f2 || echo "off")
              echo "WARP test ($i/40): IP=$CURRENT_IP, warp=$WARP_STATUS"
              if [ "$WARP_STATUS" = "on" ] || [ "$WARP_STATUS" = "plus" ]; then
                echo "✅ WARP active - SofaScore via clean Cloudflare IP $CURRENT_IP"
                WARP_READY=true
                break
              fi
            else
              echo "WARP not responding yet ($i/40)..."
            fi
          done
          if [ "$WARP_READY" != "true" ]; then
            echo "::warning::WARP not ready after 120s - continuing anyway..."
            docker logs warp 2>&1 | tail -50
          fi
        continue-on-error: true

      # 6. Run the table tennis pipeline
      - name: Run table tennis pipeline
        env:
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
          SOFASCORE_COOKIES: ${{ secrets.SOFASCORE_COOKIES }}
          SOFASCORE_PROXY: "socks5://localhost:1080"
        run: |
          echo "🏓 Scraping table tennis..."
          DATE_INPUT="${{ github.event.inputs.date }}"
          TARGET_DATE="${DATE_INPUT:-$(date +%Y-%m-%d)}"
          MAX_INPUT="${{ github.event.inputs.max_matches }}"
          MAX_ARG=""
          if [ -n "$MAX_INPUT" ]; then
            MAX_ARG="--max-matches $MAX_INPUT"
          fi
          python table_tennis_pipeline.py --date "$TARGET_DATE" $MAX_ARG

      # 7. Upload results as artifact
      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-table-tennis-${{ github.run_id }}
          path: |
            results/matches_*_table_tennis.json
            outputs/table_tennis_*.csv
          retention-days: 7

  # ── Commit scraped results back to the repo ──
  commit-results:
    needs: table-tennis
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect results
        run: |
          mkdir -p results outputs
          find artifacts -name 'matches_*_table_tennis.json' | while read f; do
            cp "$f" "results/$(basename "$f")"
          done
          find artifacts -name 'table_tennis_*.csv' | while read f; do
            cp "$f" "outputs/$(basename "$f")"
          done
          ls -la results/ || echo "No results found"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/matches_*_table_tennis.json 2>/dev/null || true
          git add outputs/table_tennis_*.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ️ No new table tennis results to commit"
          else
            TODAY=$(date +%Y-%m-%d)
            git commit -m "data: table tennis results for $TODAY [skip ci]"
            git push
            echo "✅ Results committed and pushed"
          fi
