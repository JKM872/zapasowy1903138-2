name: gemini_list_models
on: workflow_dispatch
permissions: {contents: read}
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List Gemini models (no key printed)
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request
          keys=[k.strip() for k in (os.environ.get('GEMINI_API_KEYS','')+','+os.environ.get('GEMINI_API_KEY','')).split(',') if k.strip()]
          print('keys:',len(keys))
          url='https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key='+keys[0]
          try:
              d=json.load(urllib.request.urlopen(url,timeout=30))
          except Exception as e:
              print('ERR',getattr(e,'code',type(e).__name__)); raise SystemExit(1)
          for m in d.get('models',[]):
              print(m['name'],'|',m.get('displayName'),'|',','.join(m.get('supportedGenerationMethods',[])))
          M=os.environ.get('PROBE_MODEL','gemini-4-hydrogen')
          allk=[]
          for k in keys+[os.environ.get('GEMINI_API_KEY_2','').strip()]:
              if k and k not in allk: allk.append(k)
          print('unique keys:',len(allk))
          body=json.dumps({'contents':[{'parts':[{'text':'Who won the most recent Premier League match? One sentence.'}]}],'tools':[{'google_search':{}}]}).encode()
          for i,k in enumerate(allk):
              r=urllib.request.Request(f'https://generativelanguage.googleapis.com/v1beta/models/{M}:generateContent?key={k}',data=body,headers={'Content-Type':'application/json'})
              try:
                  d=json.load(urllib.request.urlopen(r,timeout=60)); g=d['candidates'][0].get('groundingMetadata') or {}
                  print('probe key',i,'200 grounded_chunks=',len(g.get('groundingChunks',[])))
              except Exception as e:
                  b=e.read().decode()[:160] if hasattr(e,'read') else ''
                  print('probe key',i,getattr(e,'code',type(e).__name__),b.replace(k,'***'))
          EOF
