name: TOP rules (weekly re-learning)
# Re-learns outputs/top_rules.json from settled history (tools/top_rules.py):
# tuning.end = today - 17 days, holdout = tuning.end+1 .. last settled day
# (min 14 days, otherwise the job fails and the old file stays). Also writes the
# holdout before/after report outputs/top_rules_report.{md,json}.
# Commits only those three files; the rules change is visible in git history.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      tuning_end:
        description: 'tuning.end YYYY-MM-DD (empty = today UTC - 17 days)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: top-rules
  cancel-in-progress: false
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q requests==2.32.3
      - name: Build rules + holdout report
        env:
          TE_INPUT: ${{ github.event.inputs.tuning_end }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          TE="$TE_INPUT"
          [ -z "$TE" ] && TE=$(date -u -d '-17 days' +%F)
          if ! [[ "$TE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "bad tuning_end"; exit 1; fi
          echo "TE=$TE" >> "$GITHUB_ENV"
          python tools/top_rules.py --build --report --tuning-end "$TE"
      - name: Commit rules + report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/top_rules.json outputs/top_rules_report.md outputs/top_rules_report.json
          git diff --cached --quiet && exit 0
          git commit -q -m "TOP rules (tuning.end $TE)"
          ok=0
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push -q && ok=1 && break; sleep 5; done
          [ "$ok" = 1 ] || exit 1
