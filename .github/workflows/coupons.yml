name: Kupony dnia (AKO3 / AKO7 / AKO wszystkich)

# Zbiera zakwalifikowane zdarzenia z Sport Scraper i Forebet, układa kupony,
# dociąga kursy z Superbetu, wysyła na Telegram i rozlicza kupony z
# poprzednich dni. Bot nie loguje się do bukmachera i nie stawia zakładów.

on:
  schedule:
    # 10:30 UTC — po zakończeniu scrape.yml (00:00), scrape_away (03:00)
    # i większości scrape_forebet (04:00, do ~6 h).
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Data YYYY-MM-DD (domyślnie dziś UTC)'
        required: false
        default: ''

concurrency:
  group: coupons
  cancel-in-progress: false

jobs:
  coupons:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
          pip install curl-cffi 'requests[socks]' 'PySocks>=1.7.1'

      # Tor tylko do rozliczania wyników przez SofaScore (403 na IP GitHuba).
      - name: Setup Tor
        continue-on-error: true
        env:
          SOFASCORE_XRW: ${{ secrets.SOFASCORE_XRW }}
        run: bash tools/setup_tor.sh

      - name: Build coupons
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
          SOFASCORE_PROXY: "socks5h://localhost:9050"
          SOFASCORE_PROXY_PRIMARY: "1"
          SOFASCORE_XRW: ${{ secrets.SOFASCORE_XRW }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date ${{ github.event.inputs.date }}"; fi
          python tools/coupon_builder.py $ARGS

      - name: Commit coupons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/coupons/*.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Brak zmian"; exit 0; fi
          git commit -m "data: kupony $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main || true
            git rebase origin/main || git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 6) + 2 ))
          done
          echo "::warning::Nie udalo sie wypushowac kuponow"
