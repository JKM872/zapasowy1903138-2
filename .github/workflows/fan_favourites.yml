name: Fan Favourites
# SofaScore Fan Vote board (tools/fan_favourites.py). One matrix job per sport
# builds today + tomorrow in parallel (Fan Vote refresh via SOFASCORE_RELAY,
# best price across Pinnacle / OddsSafari / Livesport) and uploads its part;
# the publish job merges the parts into results/fanvote_<day>.json, settles the
# last 3 days and commits once (no parallel pushes).
on:
  schedule:
    - cron: '11 6,10,14,18 * * *'
  # The 06:00 cron often runs before the morning scrape has finished, leaving
  # the new day empty until 10:00; rebuild as soon as the scrapers commit.
  workflow_run:
    workflows: ['Sports Scraper Pipeline', 'Forebet Scraper Pipeline (Forebet-first)']
    types: [completed]
  workflow_dispatch:
    inputs:
      email:
        description: 'Wyślij mail SofaScore Fan Favourites'
        type: boolean
        default: true
      force_email:
        description: 'Wyślij mail nawet bez nowych typów'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fan-favourites
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # SofaScore day listings are built once per sport-day and read from disk after.
      SOFASCORE_LISTING_CACHE_DIR: /tmp/sofa_listing
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        sport: [football, basketball, hockey, tennis, volleyball, handball, baseball, rugby, table_tennis]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Build board
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
          FAN_FILL_BUDGET_S: '1500'
          SOFASCORE_RELAY: ${{ secrets.SOFASCORE_RELAY }}
        run: python -u tools/fan_favourites.py --sport ${{ matrix.sport }} --refresh --out fan_parts
      - uses: actions/upload-artifact@v4
        with:
          name: fan-${{ matrix.sport }}
          path: fan_parts/
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: board
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: fan-*
          path: fan_parts
      - name: Merge and settle
        env:
          PYTHONIOENCODING: utf-8
        run: |
          [ -d fan_parts ] && python tools/fan_favourites.py --merge fan_parts
          python tools/fan_favourites.py --settle --days 3
      - name: Mail Fan Favourites
        if: github.event.inputs.email != 'false'
        env:
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: |
          pip install -q openpyxl==3.1.5
          F=""; [ "${{ github.event.inputs.force_email }}" = "true" ] && F="--force"
          python -u fan_favourites_email.py $F
      - name: Commit board
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/fanvote_*.json 2>/dev/null || true
          git add -f outputs/fanfav_mail_sent_*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Fan Favourites $(date -u +%FT%H:%MZ) [skip ci]"
          git reset -q --hard HEAD
          git clean -fdq results/
          ok=0
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push -q && ok=1 && break; sleep 5; done
          [ "$ok" = 1 ] || exit 1
