name: OddsSafari Upcoming Odds (digest)

# Two digests a day instead of an hourly mail.
#
# The hourly version was technically correct and practically unusable: the same
# fixture stays on the card for hours, so even with per-fixture de-duplication
# the inbox filled up with small mails all day. Cutting the day in two blocks
# gives one mail per block, each covering fixtures that actually kick off in it:
#
#   morning digest  09:00 local -> fixtures kicking off 09:00-15:00
#   evening digest  15:00 local -> fixtures kicking off 15:00-04:00 (next day)
#
# The evening window deliberately wraps past midnight: South American fixtures
# routinely start at 01:00-02:00 Europe/Warsaw and belong to the evening block.
#
# GitHub cron has no timezone support, so each local hour is fired twice — once
# for CEST (UTC+2) and once for CET (UTC+1). The gate step keeps only the fire
# that lands on the target local hour, so exactly two runs happen per day in
# either season, and it derives the block from that hour.
#
# Filters remain the pipeline's shared ones: per-sport odds ranges from
# SPORT_ODDS_RANGE (football 1.80-2.50, handball/hockey 1.60-2.50, others
# 1.35-2.50) via is_qualifying_row, plus the bookmaker-count floor.
#
# Results are artifacts, not commits — the mail is the deliverable here, and
# oddssafari_dropping.yml remains the committed daily record.

on:
  schedule:
    # 09:00 Europe/Warsaw — morning digest (fixtures before 15:00)
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    # 15:00 Europe/Warsaw — evening digest (fixtures from 15:00 onwards)
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      block:
        description: 'Which block to report (auto = from the current local hour)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
          - all-day
      sport:
        description: 'One sport, "scheduled" for the core four, or "all" for every coupon sport'
        required: false
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - all
          - football
          - basketball
          - tennis
          - hockey
          - handball
          - baseball
          - rugby
          - esports
          # No form source for these — reported on odds/drops/bookmakers only.
          - american-football
          - darts
          - cricket
          - mma
          - boxing
      min_bookmakers:
        description: 'Minimum bookmakers pricing the candidate outcome'
        required: false
        default: '5'
        type: string
      require_drop:
        description: 'Keep only fixtures whose candidate price dropped'
        required: false
        default: false
        type: boolean
      min_drop:
        description: 'Minimum drop % on the candidate (0 = drops scored, not required)'
        required: false
        default: '0'
        type: string
      max_enrich:
        description: 'Max fixtures given form/H2H enrichment (0 = all)'
        required: false
        default: '30'
        type: string
      send_email:
        description: 'E-mail the new/changed fixtures'
        required: false
        default: true
        type: boolean
      min_score:
        description: 'Only e-mail fixtures scoring at least this (0 = no floor)'
        required: false
        default: '40'
        type: string
      dry_run:
        description: 'Odds only — skip form enrichment (no mail is sent)'
        required: false
        default: false
        type: boolean

env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: oddssafari-upcoming-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      proceed: ${{ steps.pick.outputs.proceed }}
      sports: ${{ steps.pick.outputs.sports }}
      block: ${{ steps.pick.outputs.block }}
      kickoff_from: ${{ steps.pick.outputs.kickoff_from }}
      kickoff_until: ${{ steps.pick.outputs.kickoff_until }}
      hours: ${{ steps.pick.outputs.hours }}
      target: ${{ steps.pick.outputs.target }}
    steps:
      - name: Decide the block and the sport matrix
        id: pick
        env:
          SCHEDULED: '["football","basketball","tennis","hockey"]'
          ALL: >-
            ["football","basketball","tennis","hockey","handball","baseball",
             "rugby","esports","american-football","darts","cricket","mma","boxing"]
        run: |
          LOCAL_HOUR=$(TZ='Europe/Warsaw' date +%H)
          REQUESTED_BLOCK="${{ github.event.inputs.block || 'auto' }}"
          PROCEED=true

          # Resolve the block. On a schedule the local hour decides, and any
          # other hour is a duplicate DST fire that must not run.
          if [ "$REQUESTED_BLOCK" = "auto" ]; then
            case "$LOCAL_HOUR" in
              09) BLOCK=morning ;;
              15) BLOCK=evening ;;
              *)
                if [ "${{ github.event_name }}" = "schedule" ]; then
                  echo "Skipping: local hour is $LOCAL_HOUR, not 09 or 15"
                  PROCEED=false
                  BLOCK=none
                else
                  # Manual run outside the slots: report the rest of the day.
                  BLOCK=all-day
                fi
                ;;
            esac
          else
            BLOCK="$REQUESTED_BLOCK"
          fi

          case "$BLOCK" in
            morning)
              # Fixtures up to 15:00. The horizon cannot reach tomorrow, so an
              # 02:00 fixture cannot slip in through the time-of-day filter.
              KICKOFF_FROM=""; KICKOFF_UNTIL="15:00"; HOURS="8" ;;
            evening)
              KICKOFF_FROM="15:00"; KICKOFF_UNTIL="04:00"; HOURS="15" ;;
            all-day)
              KICKOFF_FROM=""; KICKOFF_UNTIL=""; HOURS="24" ;;
            *)
              KICKOFF_FROM=""; KICKOFF_UNTIL=""; HOURS="12" ;;
          esac

          REQUESTED="${{ github.event.inputs.sport || 'scheduled' }}"
          case "$REQUESTED" in
            all)       SPORTS=$(echo "$ALL" | tr -d '[:space:]') ;;
            scheduled) SPORTS="$SCHEDULED" ;;
            *)         SPORTS="[\"$REQUESTED\"]" ;;
          esac

          echo "block=$BLOCK  window=${KICKOFF_FROM:-open}-${KICKOFF_UNTIL:-open}  hours=$HOURS"
          echo "sports=$SPORTS"
          {
            echo "proceed=$PROCEED"
            echo "block=$BLOCK"
            echo "kickoff_from=$KICKOFF_FROM"
            echo "kickoff_until=$KICKOFF_UNTIL"
            echo "hours=$HOURS"
            echo "sports=$SPORTS"
            echo "target=$(TZ='Europe/Warsaw' date +%Y-%m-%d)"
          } >> $GITHUB_OUTPUT

  upcoming-odds:
    needs: plan
    if: needs.plan.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        sport: ${{ fromJson(needs.plan.outputs.sports) }}

    # SofaScore is the form source that carries this pipeline, and Cloudflare
    # challenges GitHub's IP ranges far harder than a home connection.
    # sofascore_scraper reads FLARESOLVERR_URL and warms curl_cffi with the
    # cf_clearance cookies FlareSolverr wins; without it the form data quietly
    # collapses in CI while working fine locally.
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          CAPTCHA_SOLVER: none

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # forebet_scraper prefers Puppeteer Extra + Stealth (its documented best
      # method for CI) and looks for node_modules/puppeteer-extra, falling back
      # to curl_cffi only when Node is absent.
      - name: Setup Node.js
        if: github.event.inputs.dry_run != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Chrome
        if: github.event.inputs.dry_run != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          echo "CHROME_BIN=${CHROME_PATH}" >> $GITHUB_ENV
          echo "PUPPETEER_EXECUTABLE_PATH=${CHROME_PATH}" >> $GITHUB_ENV

      - name: Install ChromeDriver
        if: github.event.inputs.dry_run != 'true'
        uses: nanasess/setup-chromedriver@v2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
          pip install -r requirements.txt
          # requirements.txt carries no SOCKS extra, but SOFASCORE_PROXY below is
          # a socks5h:// URL — requests raises "Missing dependencies for SOCKS
          # support" without these.
          pip install 'requests[socks]' 'PySocks>=1.7.1'

      - name: Install Node.js dependencies
        if: github.event.inputs.dry_run != 'true'
        run: npm ci || npm install

      # Forebet refuses to render headless, so forebet_scraper runs Chrome on a
      # virtual display when it detects CI. Without Xvfb the Forebet step fails
      # and predictions are simply missing from the report.
      - name: Install Xvfb (Forebet needs a visible display)
        if: github.event.inputs.dry_run != 'true'
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Wait for FlareSolverr
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "Waiting for FlareSolverr..."
          for i in {1..30}; do
            if curl -s http://localhost:8191/health | grep -q '"status"'; then
              echo "FlareSolverr is ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Setup Tor (SOCKS5 on :9050)
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: bash tools/setup_tor.sh

      - name: Run upcoming-odds pipeline (${{ matrix.sport }} / ${{ needs.plan.outputs.block }})
        env:
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          SOFASCORE_PROXY: "socks5h://localhost:9050"
          SOFASCORE_PROXY_PRIMARY: "1"
          SOFASCORE_COOKIES: ${{ secrets.SOFASCORE_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXTRA=""
          if [ -n "${{ needs.plan.outputs.kickoff_from }}" ]; then
            EXTRA="$EXTRA --kickoff-from ${{ needs.plan.outputs.kickoff_from }}"
          fi
          if [ -n "${{ needs.plan.outputs.kickoff_until }}" ]; then
            EXTRA="$EXTRA --kickoff-until ${{ needs.plan.outputs.kickoff_until }}"
          fi
          if [ "${{ github.event.inputs.require_drop }}" = "true" ]; then
            EXTRA="$EXTRA --require-drop"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA="$EXTRA --dry-run"
          fi

          python oddssafari_upcoming_pipeline.py \
            --sport "${{ matrix.sport }}" \
            --hours "${{ needs.plan.outputs.hours }}" \
            --min-bookmakers "${{ github.event.inputs.min_bookmakers || '5' }}" \
            --min-drop "${{ github.event.inputs.min_drop || '0' }}" \
            --max-enrich "${{ github.event.inputs.max_enrich || '30' }}" \
            --headless \
            $EXTRA

      # Which fixtures were already mailed today has to survive between the two
      # digests, so a fixture reported in the morning is not repeated unchanged.
      # Cached rather than committed: mail bookkeeping does not belong in the
      # repository history. Keys are unique per run and read back by prefix,
      # since a cache entry cannot be overwritten.
      - name: Restore mail state (${{ matrix.sport }})
        if: github.event.inputs.send_email != 'false' && github.event.inputs.dry_run != 'true'
        uses: actions/cache/restore@v4
        with:
          path: outputs/upcoming_mailed_*.json
          key: upcoming-mail-${{ matrix.sport }}-${{ needs.plan.outputs.target }}-${{ github.run_id }}
          restore-keys: |
            upcoming-mail-${{ matrix.sport }}-${{ needs.plan.outputs.target }}-

      - name: E-mail the digest (${{ matrix.sport }})
        id: mail
        if: success() && github.event.inputs.send_email != 'false' && github.event.inputs.dry_run != 'true'
        env:
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          TARGET_DATE="${{ needs.plan.outputs.target }}"
          OUT="outputs/oddssafari_upcoming_${TARGET_DATE}_${{ matrix.sport }}.json"
          if [ ! -f "$OUT" ]; then
            echo "No pipeline output at $OUT — nothing to mail"
            exit 0
          fi
          if [ -z "$EMAIL_RECIPIENT" ] || [ -z "$EMAIL_SENDER" ] || [ -z "$EMAIL_PASSWORD" ]; then
            echo "::warning::E-mail secrets not configured — skipping the mail"
            exit 0
          fi
          python oddssafari_upcoming_email.py "$OUT" \
            --sport "${{ matrix.sport }}" \
            --min-score "${{ github.event.inputs.min_score || '40' }}"

      - name: Save mail state (${{ matrix.sport }})
        if: steps.mail.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: outputs/upcoming_mailed_*.json
          key: upcoming-mail-${{ matrix.sport }}-${{ needs.plan.outputs.target }}-${{ github.run_id }}

      - name: Summary (${{ matrix.sport }})
        if: always()
        run: |
          TARGET_DATE="${{ needs.plan.outputs.target }}"
          OUT="outputs/oddssafari_upcoming_${TARGET_DATE}_${{ matrix.sport }}.json"
          echo "## ${{ matrix.sport }} — ${{ needs.plan.outputs.block }} digest" >> "$GITHUB_STEP_SUMMARY"
          python ci_oddssafari_summary.py "$OUT" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload artifact (${{ matrix.sport }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oddssafari-upcoming-${{ matrix.sport }}-${{ needs.plan.outputs.block }}-${{ needs.plan.outputs.target }}-${{ github.run_id }}
          path: |
            outputs/oddssafari_upcoming_*.json
            outputs/upcoming_mailed_*.json
          retention-days: 5
