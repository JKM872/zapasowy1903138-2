name: Strona (GitHub Pages)
# Statyczna strona z results/*.json — bez serwera i bazy.
on:
  workflow_run:
    workflows: ['TOP picks (perełki A/B)', 'Podsumowanie dnia (Excel + AI)']
    types: [completed]
  schedule:
    - cron: '15 6-22/2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/build_site.py
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
