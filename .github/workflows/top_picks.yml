name: TOP picks (perełki A/B)
# Uzupełnienie Forebet, działa RÓWNOLEGLE: co godzinę (i po zakończeniu Forebet)
# bierze wyniki sportów, które Forebet już skończył (artefakty trwającego runu),
# wybiera z Grade A/B mecze, gdzie typ dominuje we wszystkich danych (bez hokeja,
# piłka kurs >= 2.0), dociąga SofaScore Fan Vote, aktualizuje results/TOP.xlsx
# i wysyła mail „⭐ TOP” tylko gdy pojawią się NOWE perełki.
on:
  schedule:
    - cron: '15 5-21 * * *'
  workflow_run:
    workflows: ["Forebet Scraper Pipeline (Forebet-first)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: 'Data YYYY-MM-DD (puste = dziś UTC)'
        required: false
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: top-picks
  cancel-in-progress: false
jobs:
  top:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q -r requirements.txt openpyxl==3.1.5
      - name: Pobierz wyniki gotowych sportów z dzisiejszych runów Forebet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="${{ github.event.inputs.date }}"; [ -z "$D" ] && D=$(date -u +%F)
          echo "DAY=$D" >> "$GITHUB_ENV"
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow scrape_forebet.yml -L 6 \
                        --json databaseId,createdAt -q ".[] | select(.createdAt | startswith(\"$D\")) | .databaseId"); do
            mkdir -p "/tmp/art/$id"
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'forebet-*' -D "/tmp/art/$id" 2>/dev/null || true
          done
          # najnowszy plik danego sportu wygrywa
          find /tmp/art -name "matches_${D}_*_forebet.json" -printf '%T@ %p\n' 2>/dev/null | sort -n \
            | cut -d' ' -f2- | while read f; do cp "$f" results/; done
          ls results/matches_${D}_*_forebet.json 2>/dev/null || echo "brak wyników Forebet na $D"
      - name: Build TOP + Excel + email
        env:
          SOFASCORE_RELAY: ${{ secrets.SOFASCORE_RELAY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python tools/top_picks.py "$DAY" --fanvote --email
      - name: Commit TOP json + Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/top_*.json results/TOP.xlsx
          git add results/ai_analyst_*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "TOP picks $DAY"
          git reset -q --hard HEAD
          git clean -fdq results/
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push -q && break; sleep 5; done
      - uses: actions/upload-artifact@v7
        with:
          name: TOP-${{ github.run_id }}
          path: results/TOP.xlsx
