name: Baseball Scraper Pipeline (Experimental)

on:
  # MLB games typically start 17:00-22:00 ET → run at 14:00 UTC (10 AM ET)
  # to catch lineup/pitcher announcements
  schedule:
    - cron: '0 14 * * *'

  # Allow manual trigger
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  scrape-baseball:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          CAPTCHA_SOLVER: none

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Chrome (pre-installed)
        run: |
          CHROME_PATH=$(which google-chrome-stable || which google-chrome || echo "")
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::Chrome not found on runner"
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> $GITHUB_ENV
          echo "✅ Chrome: $($CHROME_PATH --version)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 🔥 Cloudflare Bypass packages (curl_cffi is PRIMARY bypass method)
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
          pip install curl-cffi cloudscraper httpx[http2]
          # v9.0: SOCKS5 proxy support for WARP via SOFASCORE_PROXY env
          pip install 'requests[socks]' 'PySocks>=1.7.1'
          python -c "from curl_cffi import requests; print('curl_cffi OK')"

      - name: Install Node.js dependencies
        run: npm ci || npm install

      - name: Wait for FlareSolverr
        run: |
          echo "⏳ Waiting for FlareSolverr..."
          for i in {1..30}; do
            if curl -s http://localhost:8191/health | grep -q '"status"'; then
              echo "✅ FlareSolverr ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      # Setup Cloudflare WARP proxy (v10.1 — SofaScore CF bypass).
      # Uruchamiamy jako osobny `docker run` (nie services:) bo wymaga
      # --cap-add NET_ADMIN ktorego GHA services: nie wspiera.
      # setup_warp.sh: stawia WARP, sonduje SofaScore przez to IP i rotuje
      # IP gdy spalone (curl_cffi/Chrome TLS). Spojne ze scrape.yml.
      - name: Setup Tor (SOCKS5 on :9050)
        continue-on-error: true
        run: bash tools/setup_tor.sh

      # AI preflight: says outright which backend will answer. The AI signal
      # was silently dead - Gemini out of quota, Groq returning None without a
      # word - and every affected row stored 'Blad API' as if it were a verdict.
      - name: AI backend preflight
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python tools/check_ai_backend.py

      # ── Run baseball scraper ──
      - name: Run baseball scraper
        env:
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: 'false'
          # v8.1: SofaScore Cloudflare bypass via manual cookies.
          SOFASCORE_COOKIES: ${{ secrets.SOFASCORE_COOKIES }}
          # v9.0: SofaScore via Cloudflare WARP (Docker "warp" na 1080).
          SOFASCORE_PROXY: "socks5h://localhost:9050"
          SOFASCORE_PROXY_PRIMARY: "1"
        run: |
          echo "⚾ Scraping baseball..."
          TODAY=$(date +%Y-%m-%d)

          python scrape_and_notify.py \
            --date $TODAY \
            --sports baseball \
            --to "${{ secrets.EMAIL_RECIPIENT }}" \
            --from-email "${{ secrets.EMAIL_SENDER }}" \
            --password "${{ secrets.EMAIL_PASSWORD }}" \
            --provider gmail \
            --use-forebet \
            --use-sofascore \
            --use-odds \
            --use-gemini \
            --headless

      # ── Data quality report ──
      - name: Baseball data quality report
        if: always()
        run: |
          echo "⚾ Baseball Data Quality Report"
          echo "================================"
          TODAY=$(date +%Y-%m-%d)
          python3 baseball_data_quality_report.py "$TODAY"

      - name: Channel qualification summary - baseball
        if: always()
        run: |
          TODAY=$(date +%Y-%m-%d)
          python3 ci_step_summary.py baseball "$TODAY" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload baseball results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-baseball-${{ github.run_id }}
          path: |
            results/*baseball*.json
            outputs/*.csv
            outputs/mailed_manifest_*.json
            logs/
          retention-days: 14

  # ── Commit results ──
  commit-results:
    needs: scrape-baseball
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download baseball artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect results
        run: |
          mkdir -p results
          mkdir -p outputs
          echo "📦 Collecting baseball JSON results..."
          find artifacts -name '*baseball*.json' -path '*/results/*' | while read f; do
            fname=$(basename "$f")
            echo "  → $fname"
            cp "$f" "results/$fname"
          done
          echo "📦 Collecting mailed manifests (needed by check_results)..."
          find artifacts -name 'mailed_manifest_*.json' | while read f; do
            fname=$(basename "$f")
            echo "  → $fname"
            cp "$f" "outputs/$fname"
          done
          echo "📋 Outputs directory:"
          ls -la outputs/mailed_manifest_*.json 2>/dev/null || echo "No baseball manifests found"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/*baseball*.json 2>/dev/null || true
          # Bez tego linijki workflow `Check Results & Accuracy Report` nie
          # widziałby manifestów baseballowych po `actions/checkout`, bo żyły
          # one tylko jako artifacty z 14-dniową retencją.
          git add outputs/mailed_manifest_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ️ No baseball results to commit"
          else
            TODAY=$(date +%Y-%m-%d)
            git commit -m "data: baseball results for $TODAY [skip ci]"
            # Race-safe push (parallel sport workflows push to main).
            pushed=false
            for attempt in 1 2 3 4 5 6; do
              if git push origin HEAD:main; then
                echo "✅ Baseball results committed (attempt $attempt)"
                pushed=true
                break
              fi
              echo "⚠️ Push rejected (attempt $attempt) — rebasing onto origin/main..."
              git fetch origin main || true
              if ! git rebase origin/main; then
                git rebase --abort 2>/dev/null || true
              fi
              sleep $(( (RANDOM % 6) + 2 ))
            done
            if [ "$pushed" != "true" ]; then
              echo "::warning::Could not push baseball results after retries — leaving for next run"
            fi
          fi
