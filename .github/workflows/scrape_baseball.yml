name: Baseball Scraper Pipeline (Experimental)

on:
  # MLB games typically start 17:00-22:00 ET → run at 14:00 UTC (10 AM ET)
  # to catch lineup/pitcher announcements
  schedule:
    - cron: '0 14 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send email notification (experimental)'
        required: false
        default: false
        type: boolean

env:
  PYTHONIOENCODING: utf-8

jobs:
  scrape-baseball:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          CAPTCHA_SOLVER: none

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          sudo ln -sf /usr/bin/chromium-browser /usr/bin/google-chrome
          echo "CHROME_BIN=/usr/bin/chromium-browser" >> $GITHUB_ENV
          echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
          pip install curl-cffi cloudscraper httpx[http2]

      - name: Install Node.js dependencies
        run: npm ci || npm install

      - name: Wait for FlareSolverr
        run: |
          echo "⏳ Waiting for FlareSolverr..."
          for i in {1..30}; do
            if curl -s http://localhost:8191/health | grep -q '"status"'; then
              echo "✅ FlareSolverr ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      # ── Run baseball scraper ──
      - name: Run baseball scraper
        env:
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: 'false'
        run: |
          echo "⚾ Scraping baseball..."
          TODAY=$(date +%Y-%m-%d)

          # Determine email flags
          SEND_EMAIL="${{ github.event.inputs.send_email }}"
          if [ "$SEND_EMAIL" = "true" ]; then
            EMAIL_FLAGS="--to ${{ secrets.EMAIL_RECIPIENT }} --from-email ${{ secrets.EMAIL_SENDER }} --password ${{ secrets.EMAIL_PASSWORD }}"
          else
            EMAIL_FLAGS="--to noreply@localhost --from-email noreply@localhost --password dummy"
          fi

          python scrape_and_notify.py \
            --date $TODAY \
            --sports baseball \
            $EMAIL_FLAGS \
            --provider gmail \
            --use-forebet \
            --use-sofascore \
            --use-odds \
            --use-gemini \
            --headless

      # ── Data quality report ──
      - name: Baseball data quality report
        if: always()
        run: |
          echo "⚾ Baseball Data Quality Report"
          echo "================================"
          TODAY=$(date +%Y-%m-%d)
          python3 baseball_data_quality_report.py "$TODAY"

      - name: Channel qualification summary - baseball
        if: always()
        run: |
          TODAY=$(date +%Y-%m-%d)
          python3 ci_step_summary.py baseball "$TODAY" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload baseball results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-baseball-${{ github.run_id }}
          path: |
            results/*baseball*.json
            outputs/*.csv
            outputs/mailed_manifest_*.json
            logs/
          retention-days: 14

  # ── Commit results ──
  commit-results:
    needs: scrape-baseball
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download baseball artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect results
        run: |
          mkdir -p results
          mkdir -p outputs
          echo "📦 Collecting baseball JSON results..."
          find artifacts -name '*baseball*.json' -path '*/results/*' | while read f; do
            fname=$(basename "$f")
            echo "  → $fname"
            cp "$f" "results/$fname"
          done
          echo "📦 Collecting mailed manifests (needed by check_results)..."
          find artifacts -name 'mailed_manifest_*.json' | while read f; do
            fname=$(basename "$f")
            echo "  → $fname"
            cp "$f" "outputs/$fname"
          done
          echo "📋 Outputs directory:"
          ls -la outputs/mailed_manifest_*.json 2>/dev/null || echo "No baseball manifests found"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/*baseball*.json 2>/dev/null || true
          # Bez tego linijki workflow `Check Results & Accuracy Report` nie
          # widziałby manifestów baseballowych po `actions/checkout`, bo żyły
          # one tylko jako artifacty z 14-dniową retencją.
          git add outputs/mailed_manifest_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ️ No baseball results to commit"
          else
            TODAY=$(date +%Y-%m-%d)
            git commit -m "data: baseball results for $TODAY [skip ci]"
            git push
            echo "✅ Baseball results committed"
          fi
