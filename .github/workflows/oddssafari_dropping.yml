name: OddsSafari Dropping Odds Pipeline

# Independent of other scrapers. Runs daily at 12:00, 15:00 and 18:00
# Europe/Warsaw all year — dropping odds move through the day, so one look at
# noon caught only the earliest drops.
#
# GitHub cron has no timezone support, so every local hour is fired twice: once
# for CEST (UTC+2, summer) and once for CET (UTC+1, winter). The "Skip
# off-schedule run" step below keeps only the fire that lands on one of the
# three target hours, so exactly three runs happen per day in either season.
#
#   12:00 local -> 10:00 UTC (CEST) / 11:00 UTC (CET)
#   15:00 local -> 13:00 UTC (CEST) / 14:00 UTC (CET)
#   18:00 local -> 16:00 UTC (CEST) / 17:00 UTC (CET)
#
# Per-sport matrix split (9 jobs running in parallel) — football, basketball,
# tennis, hockey, handball, volleyball, esports, baseball, rugby — each
# producing its own JSON artifact and email. Cuts runtime vs a sequential job.
#
# Qualifying odds are per-sport (see SPORT_ODDS_RANGE in
# oddssafari_dropping_scraper.py): football 1.80–2.50, handball and hockey
# 1.60–2.50, every other sport 1.35–2.50. Outside its range = skipped.

on:
  schedule:
    # 12:00 Europe/Warsaw
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    # 15:00 Europe/Warsaw
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    # 18:00 Europe/Warsaw
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Livesport lookup date (YYYY-MM-DD, empty = today Europe/Warsaw)'
        required: false
        default: ''
        type: string
      min_odds:
        description: 'Override min current odds (empty = per-sport: football 1.80, handball/hockey 1.60, others 1.35)'
        required: false
        default: ''
        type: string
      max_odds:
        description: 'Override max current odds (empty = per-sport: 2.50)'
        required: false
        default: ''
        type: string
      max_enrich:
        description: 'Max events enriched with form/H2H (biggest drops first, 0 = all)'
        required: false
        default: '0'
        type: string
      sport:
        description: 'Run only one sport (all = run every sport in matrix)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - football
          - basketball
          - tennis
          - hockey
          - handball
          - volleyball
          - esports
          - baseball
          - rugby
      dry_run:
        description: 'Skip Livesport enrichment (scrape OddsSafari only)'
        required: false
        default: false
        type: boolean
      send_email:
        description: 'Send email with dropping odds results'
        required: false
        default: true
        type: boolean

env:
  PYTHONIOENCODING: utf-8

jobs:
  dropping-odds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        sport: [football, basketball, tennis, hockey, handball, volleyball, esports, baseball, rugby]

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          CAPTCHA_SOLVER: none

    steps:
      - name: Skip non-selected sports / off-schedule run
        id: skip-check
        run: |
          SKIP=false

          # Crons fire at both DST offsets for each target hour; keep only the
          # fire that lands on 12:00, 15:00 or 18:00 in Europe/Warsaw. Manual
          # runs always proceed.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LOCAL_HOUR=$(TZ='Europe/Warsaw' date +%H)
            case "$LOCAL_HOUR" in
              12|15|18)
                echo "Local Europe/Warsaw hour is $LOCAL_HOUR — proceeding"
                ;;
              *)
                echo "Skipping: local Europe/Warsaw hour is $LOCAL_HOUR, not 12/15/18"
                SKIP=true
                ;;
            esac
          fi

          REQUESTED="${{ github.event.inputs.sport || 'all' }}"
          if [ "$REQUESTED" != "all" ] && [ "$REQUESTED" != "${{ matrix.sport }}" ]; then
            echo "Skipping ${{ matrix.sport }} (user requested $REQUESTED)"
            SKIP=true
          fi

          echo "skip=$SKIP" >> $GITHUB_OUTPUT

      - name: Checkout code
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Chrome
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          echo "CHROME_BIN=${CHROME_PATH}" >> $GITHUB_ENV
          echo "PUPPETEER_EXECUTABLE_PATH=${CHROME_PATH}" >> $GITHUB_ENV

      - name: Install ChromeDriver
        if: steps.skip-check.outputs.skip != 'true'
        uses: nanasess/setup-chromedriver@v2

      - name: Verify Chrome
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          CHROMEDRIVER_PATH="$(command -v chromedriver)"
          echo "CHROMEDRIVER_PATH=${CHROMEDRIVER_PATH}" >> $GITHUB_ENV
          test -x "$CHROME_BIN"
          test -x "$CHROMEDRIVER_PATH"
          "$CHROME_BIN" --version
          "$CHROMEDRIVER_PATH" --version

      - name: Install Python dependencies
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
          pip install curl-cffi cloudscraper httpx[http2]
          pip install 'requests[socks]' 'PySocks>=1.7.1'

      - name: Install Node.js dependencies
        if: steps.skip-check.outputs.skip != 'true'
        run: npm ci || npm install

      - name: Wait for FlareSolverr
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          echo "Waiting for FlareSolverr..."
          for i in {1..30}; do
            if curl -s http://localhost:8191/health | grep -q '"status"'; then
              echo "FlareSolverr is ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Setup Tor (SOCKS5 on :9050)
        if: steps.skip-check.outputs.skip != 'true'
        continue-on-error: true
        run: bash tools/setup_tor.sh

      - name: Resolve target date
        if: steps.skip-check.outputs.skip != 'true'
        id: resolve-date
        run: |
          INPUT_DATE="${{ github.event.inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            echo "target=$INPUT_DATE" >> $GITHUB_OUTPUT
          else
            echo "target=$(TZ='Europe/Warsaw' date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Run OddsSafari dropping-odds pipeline (${{ matrix.sport }})
        if: steps.skip-check.outputs.skip != 'true'
        env:
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SOFASCORE_PROXY: "socks5h://localhost:9050"
          SOFASCORE_PROXY_PRIMARY: "1"
          SOFASCORE_COOKIES: ${{ secrets.SOFASCORE_COOKIES }}
        run: |
          TARGET_DATE="${{ steps.resolve-date.outputs.target }}"
          MIN_ODDS="${{ github.event.inputs.min_odds }}"
          MAX_ODDS="${{ github.event.inputs.max_odds }}"
          MAX_ENRICH="${{ github.event.inputs.max_enrich || '0' }}"

          # Empty bounds => the pipeline applies its per-sport ranges.
          EXTRA=""
          if [ -n "$MIN_ODDS" ]; then EXTRA="$EXTRA --min-odds $MIN_ODDS"; fi
          if [ -n "$MAX_ODDS" ]; then EXTRA="$EXTRA --max-odds $MAX_ODDS"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA="$EXTRA --dry-run"
          fi
          echo "Running ${{ matrix.sport }} pipeline for $TARGET_DATE (odds: ${MIN_ODDS:-per-sport}-${MAX_ODDS:-per-sport})"
          python oddssafari_dropping_pipeline.py \
            --date "$TARGET_DATE" \
            --sport "${{ matrix.sport }}" \
            --max-enrich "$MAX_ENRICH" \
            --headless \
            $EXTRA

      - name: Send Dropping Odds email (${{ matrix.sport }})
        if: steps.skip-check.outputs.skip != 'true' && success() && github.event.inputs.send_email != 'false'
        env:
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          TARGET_DATE="${{ steps.resolve-date.outputs.target }}"
          OUT="outputs/oddssafari_dropping_${TARGET_DATE}_${{ matrix.sport }}.json"
          if [ ! -f "$OUT" ]; then
            echo "⚠️ No output file at $OUT — skipping email"
            exit 0
          fi
          if [ -z "$EMAIL_RECIPIENT" ] || [ -z "$EMAIL_SENDER" ] || [ -z "$EMAIL_PASSWORD" ]; then
            echo "⚠️ Email secrets not configured — skipping email"
            exit 0
          fi
          python dropping_odds_email.py "$OUT" \
            --to "$EMAIL_RECIPIENT" \
            --from-email "$EMAIL_SENDER" \
            --password "$EMAIL_PASSWORD" \
            --provider gmail \
            --sport "${{ matrix.sport }}" \
            --min-recent-wins 0

      - name: Summary (${{ matrix.sport }})
        if: steps.skip-check.outputs.skip != 'true' && always()
        run: |
          TARGET_DATE="${{ steps.resolve-date.outputs.target }}"
          OUT="outputs/oddssafari_dropping_${TARGET_DATE}_${{ matrix.sport }}.json"
          echo "## ${{ matrix.sport }} — ${TARGET_DATE}" >> "$GITHUB_STEP_SUMMARY"
          python ci_oddssafari_summary.py "$OUT" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload artifact (${{ matrix.sport }})
        if: steps.skip-check.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: oddssafari-dropping-${{ matrix.sport }}-${{ steps.resolve-date.outputs.target }}-${{ github.run_id }}
          path: |
            outputs/oddssafari_dropping_*.json
            logs/
          retention-days: 14

  # Single commit job at the end so all sport JSONs land in one commit.
  commit-results:
    needs: dropping-odds
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect dropping-odds JSONs
        run: |
          mkdir -p outputs
          echo "📦 Collecting dropping-odds JSONs from artifacts..."
          find artifacts -name 'oddssafari_dropping_*.json' | while read f; do
            fname=$(basename "$f")
            echo "  → $fname"
            cp "$f" "outputs/$fname"
          done
          ls -la outputs/oddssafari_dropping_*.json 2>/dev/null || echo "No JSONs found"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/oddssafari_dropping_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ️ No new dropping-odds output to commit"
          else
            TODAY=$(TZ='Europe/Warsaw' date +%Y-%m-%d)
            git commit -m "data: oddssafari dropping odds for $TODAY [skip ci]"
            pushed=false
            for attempt in 1 2 3 4 5 6; do
              if git push origin HEAD:main; then
                echo "✅ Pushed dropping odds JSONs (attempt $attempt)"
                pushed=true
                break
              fi
              echo "⚠️ Push rejected (attempt $attempt) — rebasing onto origin/main..."
              git fetch origin main || true
              if ! git rebase origin/main; then
                git rebase --abort 2>/dev/null || true
              fi
              sleep $(( (RANDOM % 6) + 2 ))
            done
            if [ "$pushed" != "true" ]; then
              echo "::warning::Could not push dropping odds after retries — leaving for next run"
            fi
          fi
