name: OddsSafari Dropping Odds Pipeline

# Independent of other scrapers. Runs daily at 10:00 UTC which equals
# 12:00 Europe/Warsaw in CEST (summer). During CET (winter) the same cron
# fires at 11:00 local time; GitHub Actions cron does not support timezones
# natively. Trigger manually via workflow_dispatch to adjust when needed.

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Livesport lookup date (YYYY-MM-DD, empty = today Europe/Warsaw)'
        required: false
        default: ''
        type: string
      min_odds:
        description: 'Lower bound of qualifying current odds (inclusive)'
        required: false
        default: '1.35'
        type: string
      max_odds:
        description: 'Upper bound of qualifying current odds (inclusive)'
        required: false
        default: '2.20'
        type: string
      dry_run:
        description: 'Skip Livesport enrichment (scrape OddsSafari only)'
        required: false
        default: false
        type: boolean
      send_email:
        description: 'Send email with dropping odds results'
        required: false
        default: true
        type: boolean

env:
  PYTHONIOENCODING: utf-8

jobs:
  dropping-odds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          CAPTCHA_SOLVER: none

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          echo "CHROME_BIN=${CHROME_PATH}" >> $GITHUB_ENV
          echo "PUPPETEER_EXECUTABLE_PATH=${CHROME_PATH}" >> $GITHUB_ENV

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Verify Chrome
        run: |
          CHROMEDRIVER_PATH="$(command -v chromedriver)"
          echo "CHROMEDRIVER_PATH=${CHROMEDRIVER_PATH}" >> $GITHUB_ENV
          test -x "$CHROME_BIN"
          test -x "$CHROMEDRIVER_PATH"
          "$CHROME_BIN" --version
          "$CHROMEDRIVER_PATH" --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
          pip install curl-cffi cloudscraper httpx[http2]
          pip install 'requests[socks]' 'PySocks>=1.7.1'

      - name: Install Node.js dependencies
        run: npm ci || npm install

      - name: Wait for FlareSolverr
        run: |
          echo "Waiting for FlareSolverr..."
          for i in {1..30}; do
            if curl -s http://localhost:8191/health | grep -q '"status"'; then
              echo "FlareSolverr is ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Setup Cloudflare WARP proxy (SOCKS5 on :1080)
        run: |
          echo "🌐 Starting Cloudflare WARP proxy container..."
          docker run -d --name warp \
            --restart=always \
            --device-cgroup-rule='c 10:200 rwm' \
            -p 1080:1080 \
            -e WARP_SLEEP=2 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v /lib/modules:/lib/modules \
            caomingjun/warp:latest

          echo "⏳ Waiting for WARP to register..."
          WARP_READY=false
          for i in {1..40}; do
            sleep 3
            CURRENT_IP=$(curl -s --max-time 10 --socks5 localhost:1080 https://api.ipify.org 2>/dev/null || echo "")
            if [ -n "$CURRENT_IP" ]; then
              WARP_STATUS=$(curl -s --max-time 10 --socks5 localhost:1080 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -E '^warp=' | cut -d= -f2 || echo "off")
              echo "WARP test ($i/40): IP=$CURRENT_IP, warp=$WARP_STATUS"
              if [ "$WARP_STATUS" = "on" ] || [ "$WARP_STATUS" = "plus" ]; then
                echo "✅ WARP active — SofaScore via clean IP $CURRENT_IP"
                WARP_READY=true
                break
              fi
            else
              echo "WARP not responding yet ($i/40)..."
            fi
          done
          if [ "$WARP_READY" != "true" ]; then
            echo "::warning::WARP not ready — SofaScore may be blocked"
          fi
        continue-on-error: true

      - name: Resolve target date
        id: resolve-date
        run: |
          INPUT_DATE="${{ github.event.inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            echo "target=$INPUT_DATE" >> $GITHUB_OUTPUT
          else
            echo "target=$(TZ='Europe/Warsaw' date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Run OddsSafari dropping-odds pipeline
        env:
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SOFASCORE_PROXY: "socks5://localhost:1080"
        run: |
          TARGET_DATE="${{ steps.resolve-date.outputs.target }}"
          MIN_ODDS="${{ github.event.inputs.min_odds || '1.35' }}"
          MAX_ODDS="${{ github.event.inputs.max_odds || '2.20' }}"
          EXTRA=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          echo "Running pipeline for $TARGET_DATE (odds ${MIN_ODDS}-${MAX_ODDS})"
          python oddssafari_dropping_pipeline.py \
            --date "$TARGET_DATE" \
            --min-odds "$MIN_ODDS" \
            --max-odds "$MAX_ODDS" \
            --headless \
            $EXTRA

      - name: Send Dropping Odds email
        if: success() && github.event.inputs.send_email != 'false'
        env:
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          TARGET_DATE="${{ steps.resolve-date.outputs.target }}"
          OUT="outputs/oddssafari_dropping_${TARGET_DATE}.json"
          if [ ! -f "$OUT" ]; then
            echo "⚠️ No output file found at $OUT — skipping email"
            exit 0
          fi
          if [ -z "$EMAIL_RECIPIENT" ] || [ -z "$EMAIL_SENDER" ] || [ -z "$EMAIL_PASSWORD" ]; then
            echo "⚠️ Email secrets not configured — skipping email"
            exit 0
          fi
          python dropping_odds_email.py "$OUT" \
            --to "$EMAIL_RECIPIENT" \
            --from-email "$EMAIL_SENDER" \
            --password "$EMAIL_PASSWORD" \
            --provider gmail

      - name: Summary
        if: always()
        run: |
          TARGET_DATE="${{ steps.resolve-date.outputs.target }}"
          OUT="outputs/oddssafari_dropping_${TARGET_DATE}.json"
          echo "## OddsSafari dropping odds — ${TARGET_DATE}" >> "$GITHUB_STEP_SUMMARY"
          python ci_oddssafari_summary.py "$OUT" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oddssafari-dropping-${{ steps.resolve-date.outputs.target }}-${{ github.run_id }}
          path: |
            outputs/oddssafari_dropping_*.json
            logs/
          retention-days: 14

      - name: Commit dropping-odds output
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/oddssafari_dropping_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No dropping-odds output to commit"
          else
            TARGET_DATE="${{ steps.resolve-date.outputs.target }}"
            git commit -m "data: oddssafari dropping odds for $TARGET_DATE [skip ci]"
            git push
          fi
