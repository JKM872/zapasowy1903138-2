name: Noon Refresh — Forebet + SofaScore Update

on:
  # Run daily at 12:00 UTC (14:00 CEST / 13:00 CET)
  schedule:
    - cron: '0 12 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to refresh (YYYY-MM-DD, empty = today)'
        required: false
        default: ''
        type: string
      skip_email:
        description: 'Skip sending email (refresh data only)'
        required: false
        default: false
        type: boolean

env:
  PYTHONIOENCODING: utf-8

jobs:
  refresh:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          CAPTCHA_SOLVER: none

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Chrome (pre-installed)
        run: |
          CHROME_PATH=$(which google-chrome-stable || which google-chrome || echo "")
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::Chrome not found on runner"
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> $GITHUB_ENV
          echo "✅ Chrome: $($CHROME_PATH --version)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
          pip install curl-cffi cloudscraper httpx[http2]
          # v10.1: SOCKS5 proxy support for WARP via SOFASCORE_PROXY env
          pip install 'requests[socks]' 'PySocks>=1.7.1'

      - name: Install Node.js dependencies
        run: npm ci || npm install

      - name: Wait for FlareSolverr
        run: |
          echo "⏳ Waiting for FlareSolverr..."
          for i in {1..30}; do
            if curl -s http://localhost:8191/health | grep -q '"status"'; then
              echo "✅ FlareSolverr ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      # v10.1: Setup Cloudflare WARP (SofaScore CF bypass). Bez tego noon
      # refresh leci po SofaScore z golego IP datacenter GHA -> 403 na kazdym
      # meczu. setup_warp.sh stawia WARP, sonduje SofaScore przez to IP i
      # rotuje IP gdy spalone. Spojne ze scrape.yml.
      - name: Setup Cloudflare WARP proxy (SOCKS5 on :1080)
        continue-on-error: true
        run: bash tools/setup_warp.sh

      - name: Determine date
        id: date
        run: |
          INPUT_DATE="${{ github.event.inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            echo "today=$INPUT_DATE" >> $GITHUB_OUTPUT
          else
            echo "today=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
          echo "📅 Date: $(cat $GITHUB_OUTPUT | grep today | cut -d= -f2)"

      - name: Check morning manifest exists
        id: manifest
        run: |
          TODAY="${{ steps.date.outputs.today }}"
          FOUND=$(find outputs -name "mailed_manifest_${TODAY}*.json" ! -name "*_noon*" 2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Morning manifest found: $FOUND"
            echo "📋 Files:"
            ls -la outputs/mailed_manifest_${TODAY}*.json 2>/dev/null || true
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No morning manifest for $TODAY — skipping refresh"
          fi

      # ── Run noon refresh ──
      - name: Run noon refresh
        if: steps.manifest.outputs.exists == 'true'
        env:
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # v10.1: SofaScore via Cloudflare WARP (clean IP). Pod WARP scraper
          # idzie czystym requestem (bez cf_clearance) — patrz _cookies_for_curl.
          SOFASCORE_PROXY: "socks5://localhost:1080"
          SOFASCORE_COOKIES: ${{ secrets.SOFASCORE_COOKIES }}
        run: |
          TODAY="${{ steps.date.outputs.today }}"
          SKIP_EMAIL="${{ github.event.inputs.skip_email }}"

          EMAIL_FLAGS="--to ${{ secrets.EMAIL_RECIPIENT }} --from-email ${{ secrets.EMAIL_SENDER }} --password ${{ secrets.EMAIL_PASSWORD }} --provider gmail"

          EXTRA_FLAGS="--headless"
          if [ "$SKIP_EMAIL" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --skip-email"
          fi

          python refresh_qualified_manifest.py \
            --date $TODAY \
            $EMAIL_FLAGS \
            $EXTRA_FLAGS

      - name: Upload noon artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: noon-refresh-${{ steps.date.outputs.today }}-${{ github.run_id }}
          path: |
            outputs/mailed_manifest_*_noon.json
            logs/
          retention-days: 7

  # ── Commit noon results ──
  commit-noon:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download noon artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect noon manifest
        run: |
          mkdir -p outputs
          find artifacts -name 'mailed_manifest_*_noon.json' | while read f; do
            fname=$(basename "$f")
            echo "  → $fname"
            cp "$f" "outputs/$fname"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/mailed_manifest_*_noon.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ️ No noon results to commit"
          else
            TODAY=$(date +%Y-%m-%d)
            git commit -m "data: noon refresh for $TODAY [skip ci]"
            pushed=false
            for attempt in 1 2 3 4 5 6; do
              if git push origin HEAD:main; then
                echo "✅ Noon results committed (attempt $attempt)"
                pushed=true
                break
              fi
              echo "⚠️ Push rejected (attempt $attempt) — rebasing onto origin/main..."
              git fetch origin main || true
              if ! git rebase origin/main; then
                git rebase --abort 2>/dev/null || true
              fi
              sleep $(( (RANDOM % 6) + 2 ))
            done
            if [ "$pushed" != "true" ]; then
              echo "::warning::Could not push noon results after retries — leaving for next run"
            fi
          fi
