name: "Check Results & Accuracy Report"

on:
  # Run daily at 22:00 UTC (late evening — most matches finished)
  schedule:
    - cron: '0 22 * * *'

  # Allow manual trigger for any date
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to check (YYYY-MM-DD). Default: today'
        required: false
        type: string

env:
  PYTHONIOENCODING: utf-8

jobs:
  check-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      # Cloudflare bypass for the SofaScore API. Without it settlement gets a
      # flat 403 from GitHub's datacenter IPs: the first CI run of the new
      # resolver settled 0 of 136 here while settling 119 locally.
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          CAPTCHA_SOLVER: none

    steps:
      # 1. Checkout repository (includes committed manifests)
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Chrome (pre-installed)
        run: |
          # google-chrome-stable is pre-installed on ubuntu-latest runners
          # chromium-browser is a snap package that CANNOT install on GHA (no Snap Store)
          CHROME_PATH=$(which google-chrome-stable || which google-chrome || echo "")
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::Chrome not found on runner"
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          echo "✅ Chrome: $($CHROME_PATH --version)"

      # 4. Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4b. SofaScore reaches us through Cloudflare, which refuses GitHub's
      # datacenter ranges outright. Tor gives the resolver an exit IP that is
      # not on that list; FlareSolverr above is the second line when it is.
      - name: Setup Tor (SOCKS5 on :9050)
        continue-on-error: true
        run: bash tools/setup_tor.sh

      # 5. Determine target date
      - name: Set target date
        id: set-date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "TARGET_DATE=${{ github.event.inputs.date }}" >> $GITHUB_ENV
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "TARGET_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
            echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
          echo "📅 Checking results for: $TARGET_DATE"

      # 6. Run the result checker
      - name: Check results & generate report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Same bypass chain the scrapers use, in the same order.
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          SOFASCORE_COOKIES: ${{ secrets.SOFASCORE_COOKIES }}
          SOFASCORE_PROXY: "socks5h://localhost:9050"
          SOFASCORE_PROXY_PRIMARY: "1"
        run: |
          echo "📊 Checking results for $TARGET_DATE..."
          # Settlement goes through the SofaScore API first (no browser), and
          # only falls back to Chrome for fixtures it could not resolve. On
          # 2026-07-28 the API settled 119 of 136 where the browser path had
          # settled none, because three quarters of the card were AiScore URLs
          # the Livesport parser cannot read.
          python check_results.py \
            --date $TARGET_DATE \
            --headless \
            --send-email \
            --to "${{ secrets.EMAIL_RECIPIENT }}" \
            --from-email "${{ secrets.EMAIL_SENDER }}" \
            --password "${{ secrets.EMAIL_PASSWORD }}" \
            --provider gmail

      # 6b. Check Telegram-only subset (accuracy of picks actually sent to Telegram).
      # Runs only when a telegram manifest exists for the target date; skips mailing
      # to avoid a duplicate report — the JSON summary is committed alongside the email one.
      - name: Check Telegram-sent matches
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          SOFASCORE_COOKIES: ${{ secrets.SOFASCORE_COOKIES }}
          SOFASCORE_PROXY: "socks5h://localhost:9050"
          SOFASCORE_PROXY_PRIMARY: "1"
        run: |
          if [ -f "outputs/telegram_manifest_${TARGET_DATE}.json" ]; then
            echo "📨 Telegram manifest found — checking results for picks sent to Telegram..."
            python check_results.py \
              --date $TARGET_DATE \
              --headless \
              --manifest telegram
          else
            echo "ℹ️ No telegram manifest for $TARGET_DATE — skipping Telegram subset check"
          fi

      # 6c. Which kinds of picks actually pay. The filters steering the mail
      # (grade A/B, the odds floor) were never measured against outcomes; this
      # puts the numbers in the run summary after every settlement.
      - name: Segment performance
        if: always()
        run: |
          echo "## Skuteczność po segmentach" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python tools/segment_performance.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 7. Commit result summary + the accumulated result store.
      # The store is what makes backtesting possible: it is the only place
      # final scores survive between runs. Previously it lived only on the
      # runner and vanished with it.
      - name: Commit result summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/results_summary_*.json 2>/dev/null || true
          git add outputs/result_store.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ️ No new summaries to commit"
          else
            git commit -m "data: results summary for $TARGET_DATE [skip ci]"
            pushed=false
            for attempt in 1 2 3 4 5 6; do
              if git push origin HEAD:main; then
                echo "✅ Summary committed and pushed (attempt $attempt)"
                pushed=true
                break
              fi
              echo "⚠️ Push rejected (attempt $attempt) — rebasing onto origin/main..."
              git fetch origin main || true
              if ! git rebase origin/main; then
                git rebase --abort 2>/dev/null || true
              fi
              sleep $(( (RANDOM % 6) + 2 ))
            done
            if [ "$pushed" != "true" ]; then
              echo "::warning::Could not push summary after retries — leaving for next run"
            fi
          fi

      # 8. Upload summary as artifact
      - name: Upload summary
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-summary-${{ steps.set-date.outputs.date }}-${{ github.run_id }}
          path: |
            outputs/results_summary_*.json
            outputs/result_store.json
          retention-days: 30
