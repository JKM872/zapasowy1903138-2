name: "Check Results & Accuracy Report"

on:
  # Run daily at 22:00 UTC (late evening — most matches finished)
  schedule:
    - cron: '0 22 * * *'

  # Allow manual trigger for any date
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to check (YYYY-MM-DD). Default: today'
        required: false
        type: string

env:
  PYTHONIOENCODING: utf-8

jobs:
  check-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout repository (includes committed manifests)
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install Chrome for Selenium
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          sudo ln -sf /usr/bin/chromium-browser /usr/bin/google-chrome
          echo "CHROME_BIN=/usr/bin/chromium-browser" >> $GITHUB_ENV

      # 4. Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Determine target date
      - name: Set target date
        id: set-date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "TARGET_DATE=${{ github.event.inputs.date }}" >> $GITHUB_ENV
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "TARGET_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
            echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
          echo "📅 Checking results for: $TARGET_DATE"

      # 6. Run the result checker
      - name: Check results & generate report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "📊 Checking results for $TARGET_DATE..."
          python check_results.py \
            --date $TARGET_DATE \
            --headless \
            --send-email \
            --to "${{ secrets.EMAIL_RECIPIENT }}" \
            --from-email "${{ secrets.EMAIL_SENDER }}" \
            --password "${{ secrets.EMAIL_PASSWORD }}" \
            --provider gmail

      # 6b. Check Telegram-only subset (accuracy of picks actually sent to Telegram).
      # Runs only when a telegram manifest exists for the target date; skips mailing
      # to avoid a duplicate report — the JSON summary is committed alongside the email one.
      - name: Check Telegram-sent matches
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -f "outputs/telegram_manifest_${TARGET_DATE}.json" ]; then
            echo "📨 Telegram manifest found — checking results for picks sent to Telegram..."
            python check_results.py \
              --date $TARGET_DATE \
              --headless \
              --manifest telegram
          else
            echo "ℹ️ No telegram manifest for $TARGET_DATE — skipping Telegram subset check"
          fi

      # 7. Commit result summary
      - name: Commit result summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/results_summary_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ️ No new summaries to commit"
          else
            git commit -m "data: results summary for $TARGET_DATE [skip ci]"
            git push
            echo "✅ Summary committed and pushed"
          fi

      # 8. Upload summary as artifact
      - name: Upload summary
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-summary-${{ steps.set-date.outputs.date }}-${{ github.run_id }}
          path: outputs/results_summary_*.json
          retention-days: 30
